<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>じかんをはかる</title>
  </head>
  <body>
    <div class="plus-minus">
      <button id="hour-plus">➕</button>
      <button id="hour-minus">➖</button>
      <button id="minute-plus">➕</button>
      <button id="minute-minus">➖</button>
      <button id="second-plus">➕</button>
      <button id="second-minus">➖</button>
    </div>
    <div class="time">
      <p><span id="hour">0</span>じかん</p>
      <p><span id="minute">00</span>ふん</p>
      <p><span id="second">00</span>びょう</p>
    </div>
    <div class="button">
      <button id="start">はじめる</button>
      <button id="stop">とめる</button>
      <button id="reset">さいしょから</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
